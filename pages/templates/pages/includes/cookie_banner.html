{% load static %}

{% comment %}
Cookie-баннер. Показывается при первом заходе.
Сообщает о минимальном использовании cookies.
Сторонние аналитические и маркетинговые скрипты не используются.
{% endcomment %}

<div class="cookie-banner" id="cookieBanner" role="dialog" aria-label="Уведомление о cookies" hidden>
    <div class="cookie-banner__container">

        <div class="cookie-banner__icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="9" cy="10" r="1" fill="currentColor"/>
                <circle cx="15" cy="9" r="1" fill="currentColor"/>
                <circle cx="10" cy="15" r="1" fill="currentColor"/>
                <circle cx="15" cy="14" r="1" fill="currentColor"/>
            </svg>
        </div>

        <p class="cookie-banner__text">
            Сайт использует технические cookies, чтобы работали вход, фильтры и защита.
            <a href="{% url 'pages:cookies' %}">Подробнее</a>.
        </p>

        <div class="cookie-banner__actions">
            <button type="button"
                    class="cookie-banner__btn cookie-banner__btn--primary js-cookie-accept">
                Хорошо
            </button>
        </div>

    </div>
</div>
