{% extends "base.html" %}

{% block title %}{{ doc.title }} — Афиша Искитим{% endblock %}

{% block content %}
<div class="container" style="max-width: 760px; padding: 32px 16px 80px;">
    <h1>{{ doc.title }}</h1>
    <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 32px;">
        Редакция {{ doc.version }} от {{ doc.effective_date|date:"d.m.Y" }}
    </p>
    <div style="font-size: 0.95rem; line-height: 1.7; color: var(--text-secondary); white-space: pre-wrap;">
        {{ doc.body }}
    </div>
</div>
{% endblock %}
