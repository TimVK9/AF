<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#f7f9f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background:#f7f9f8;padding:32px 16px;">
<tr><td align="center">

<table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(20,24,26,0.08);">

<!-- Шапка -->
<tr>
<td style="background:#0f766e;padding:28px 32px;text-align:center;">
<span style="font-size:18px;font-weight:800;color:#ffffff;letter-spacing:-0.02em;">
АФИША<span style="opacity:0.7;">ИСКИТИМ</span>
</span>
</td>
</tr>

<!-- Тело письма -->
<tr>
<td style="padding:36px 32px 24px;">
<h1 style="margin:0 0 16px;font-size:20px;font-weight:700;color:#202122;">
Здравствуйте{% if name %}, {{ name }}{% endif %}!
</h1>
<p style="margin:0 0 28px;font-size:15px;line-height:1.6;color:#3d474b;">
Для входа на сайт введите этот код. Он действует <strong>10 минут</strong>.
</p>

<!-- Код -->
<table width="100%" cellpadding="0" cellspacing="0">
<tr>
<td align="center">
<div style="display:inline-block;padding:20px 48px;background:#eef2f1;border-radius:12px;border:2px dashed rgba(15,118,110,0.3);">
<span style="font-size:36px;font-weight:800;letter-spacing:0.4em;color:#0f766e;font-family:'Courier New',monospace;">
{{ code }}
</span>
</div>
</td>
</tr>
</table>

<p style="margin:28px 0 0;font-size:13px;color:#6b767a;line-height:1.5;">
Если вы не запрашивали этот код — просто проигнорируйте письмо. Кто-то, возможно, ввёл ваш email по ошибке.
</p>
</td>
</tr>

<!-- Подвал -->
<tr>
<td style="padding:24px 32px;background:#f7f9f8;border-top:1px solid rgba(20,24,26,0.06);">
<p style="margin:0;font-size:12px;color:#9aa3a7;text-align:center;line-height:1.5;">
Афиша Искитим — события города<br>
<a href="https://afisha-iskitim.ru" style="color:#6b767a;text-decoration:none;">afisha-iskitim.ru</a>
</p>
</td>
</tr>

</table>

</td>
</tr>
</table>

</body>
</html>
