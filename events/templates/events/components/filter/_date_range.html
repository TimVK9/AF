{% load query_tags %}

<form method="get" class="date-range-form" id="dateRangeForm">

    {% if selected_category %}<input type="hidden" name="category" value="{{ selected_category }}">{% endif %}
    {% if search_query %}<input type="hidden" name="search" value="{{ search_query }}">{% endif %}
    {% if sort %}<input type="hidden" name="sort" value="{{ sort }}">{% endif %}
    {% if date_filter %}<input type="hidden" name="date_filter" value="{{ date_filter }}">{% endif %}

    <div class="date-field">
        <div class="date-input-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <input type="date" name="start_date" value="{{ start_date }}" class="date-input" placeholder="С даты">
        </div>
    </div>

    <span class="date-separator">—</span>

    <div class="date-field">
        <div class="date-input-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <input type="date" name="end_date" value="{{ end_date }}" class="date-input" placeholder="По дату">
        </div>
    </div>

    <button type="submit" class="apply-btn">Применить</button>

    {% if start_date or end_date %}
        <a href="{% querystring start_date='' end_date='' %}" class="clear-btn">Сбросить даты</a>
    {% endif %}

</form>
