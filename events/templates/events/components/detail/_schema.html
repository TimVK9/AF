{% comment %}
Schema.org Event (JSON-LD) — расширенные rich results Google/Яндекс.

url — фиксированный, без GET-параметров.
image — массив (несколько размеров).
eventStatus — берётся из статуса модели.
geo — координаты площадки (если есть).
{% endcomment %}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "Event",
    "name": "{{ event.title|escapejs }}",
    "description": "{{ event.description_short|default:event.title|truncatechars:180|escapejs }}",
    "url": "{{ request.scheme }}://{{ request.get_host }}{% url 'events:event_detail' event.slug %}",
    {% if event.main_image %}
    "image": [
        "{{ request.scheme }}://{{ request.get_host }}{{ event.main_image.url }}"
    ],
    {% elif event.place.main_image %}
    "image": [
        "{{ request.scheme }}://{{ request.get_host }}{{ event.place.main_image.url }}"
    ],
    {% endif %}
    "startDate": "{{ event.start_date|date:'c' }}{% if event.start_time %}T{{ event.start_time|time:'H:i:s' }}{% endif %}",
    {% if event.end_date %}
    "endDate": "{{ event.end_date|date:'c' }}{% if event.end_time %}T{{ event.end_time|time:'H:i:s' }}{% endif %}",
    {% endif %}
    "eventStatus": "https://schema.org/EventScheduled",
    "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
    "datePublished": "{{ event.created_at|date:'c' }}",
    "dateModified": "{{ event.updated_at|date:'c' }}",
    "inLanguage": "ru-RU",
    {% if event.place %}
    "location": {
        "@type": "Place",
        "name": "{{ event.place.name|escapejs }}",
        "address": {
            "@type": "PostalAddress",
            "streetAddress": "{{ event.place.street|escapejs }}{% if event.place.house_number %}, {{ event.place.house_number }}{% endif %}",
            "addressLocality": "Искитим",
            "addressRegion": "Новосибирская область",
            {% if event.place.postal_code %}"postalCode": "{{ event.place.postal_code|escapejs }}",{% endif %}
            "addressCountry": "RU"
        },
        "url": "{{ request.scheme }}://{{ request.get_host }}{% url 'events:place_detail' event.place.slug %}"
        {% if event.place.lat_str and event.place.lng_str %}
        ,"geo": {
            "@type": "GeoCoordinates",
            "latitude": {{ event.place.lat_str }},
            "longitude": {{ event.place.lng_str }}
        }
        {% endif %}
    },
    {% endif %}
    {% if event.category %}
    "about": {
        "@type": "Thing",
        "name": "{{ event.category.name|escapejs }}"
    },
    {% endif %}
    {% if event.is_free %}
    "isAccessibleForFree": true,
    "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "RUB",
        "availability": "https://schema.org/InStock",
        "url": "{{ request.scheme }}://{{ request.get_host }}{% url 'events:event_detail' event.slug %}"
    },
    {% elif event.price %}
    "offers": {
        "@type": "Offer",
        "price": {{ event.price|floatformat:0 }},
        "priceCurrency": "RUB",
        "availability": "https://schema.org/InStock",
        "url": "{{ request.scheme }}://{{ request.get_host }}{% url 'events:event_detail' event.slug %}"
    },
    {% endif %}
    "organizer": {
        "@type": "Organization",
        "name": "{{ event.organizer_name|default:'Афиша Искитим'|escapejs }}",
        {% if event.organizer_vk %}"url": "{{ event.organizer_vk|escapejs }}",{% else %}"url": "{{ request.scheme }}://{{ request.get_host }}",{% endif %}
        {% if event.organizer_email %}"email": "{{ event.organizer_email|escapejs }}",{% endif %}
        {% if event.organizer_phone %}"telephone": "{{ event.organizer_phone|escapejs }}",{% endif %}
        {% if event.organizer_vk %}
        "sameAs": ["{{ event.organizer_vk|escapejs }}"]
        {% else %}
        "sameAs": []
        {% endif %}
    },
    "performer": {
        "@type": "PerformingGroup",
        "name": "{{ event.title|escapejs }}"
    }
}
</script>
