{% comment %}
JS страницы события:
  1. Кнопка «Поделиться в MAX»
  2. Кнопка «Скопировать ссылку»
  3. Копирование в буфер (с фолбэком для http)
  4. Тост снизу экрана
{% endcomment %}
<script>
(function () {
    'use strict';

    /* ----- 1. Кнопка «Поделиться в MAX» ----- */
    document.addEventListener('click', function (e) {
        var btn = e.target.closest('.js-share-max');
        if (!btn) return;

        var title = btn.getAttribute('data-share-title') || document.title;
        var text  = btn.getAttribute('data-share-text')  || title;
        var url   = btn.getAttribute('data-share-url')   || window.location.href;

        // Мобильные: системное меню «Поделиться»
        if (navigator.share) {
            navigator.share({ title: title, text: text, url: url })
                .catch(function () { /* отмена — молчим */ });
            return;
        }

        // Десктоп: копируем «Название — URL» в буфер
        copyToClipboard(text).then(function (ok) {
            showToast(ok
                ? 'Ссылка скопирована — вставьте в MAX'
                : 'Не удалось скопировать ссылку');
        });
    });

    /* ----- 2. Кнопка «Скопировать ссылку» ----- */
    document.addEventListener('click', function (e) {
        var btn = e.target.closest('.js-copy-btn');
        if (!btn) return;

        var url = btn.getAttribute('data-share-url') || window.location.href;

        copyToClipboard(url).then(function (ok) {
            showToast(ok ? 'Ссылка скопирована' : 'Не удалось скопировать ссылку');
        });
    });

    /* ----- 3. Копирование в буфер ----- */
    function copyToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text)
                .then(function () { return true; })
                .catch(function () { return legacyCopy(text); });
        }
        return Promise.resolve(legacyCopy(text));
    }

    function legacyCopy(text) {
        try {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.top = '-1000px';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            ta.setSelectionRange(0, ta.value.length);
            var ok = document.execCommand('copy');
            document.body.removeChild(ta);
            return ok;
        } catch (err) {
            return false;
        }
    }

    /* ----- 4. Тост снизу экрана ----- */
    var toastTimer = null;

    function showToast(message) {
        var toast = document.getElementById('shareToast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'shareToast';
            toast.className = 'share-toast';
            toast.setAttribute('role', 'status');
            toast.setAttribute('aria-live', 'polite');
            document.body.appendChild(toast);
        }

        toast.textContent = message;
        toast.classList.add('share-toast--visible');

        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
            toast.classList.remove('share-toast--visible');
        }, 2400);
    }
})();
</script>
