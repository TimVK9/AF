<script>
(function () {
    'use strict';

    function ready(fn) {
        if (document.readyState !== 'loading') fn();
        else document.addEventListener('DOMContentLoaded', fn);
    }

    ready(function () {

        // 1. Нативная кнопка «Поделиться»
        var nativeBtn = document.querySelector('.js-share-native');

        if (nativeBtn && !nativeBtn.dataset.bound) {
            nativeBtn.dataset.bound = '1';

            if (typeof navigator.share !== 'function') {
                nativeBtn.style.display = 'none';
            } else {
                var sharing = false;

                nativeBtn.addEventListener('click', function () {
                    if (sharing) return;
                    sharing = true;
                    nativeBtn.disabled = true;

                    var title = nativeBtn.getAttribute('data-share-title') || document.title;
                    var text  = nativeBtn.getAttribute('data-share-text') || '';
                    var url   = nativeBtn.getAttribute('data-share-url')  || window.location.href;

                    navigator.share({ title: title, text: text, url: url })
                        .catch(function (err) {
                            if (err && err.name !== 'AbortError' && err.name !== 'InvalidStateError') {
                                console.warn('[share] ошибка:', err);
                            }
                        })
                        .finally(function () {
                            sharing = false;
                            nativeBtn.disabled = false;
                        });
                });
            }
        }

        // 2. Кнопка «Скопировать ссылку» — делегирование
        document.addEventListener('click', function (e) {
            var btn = e.target.closest('.js-copy-btn');
            if (!btn) return;
            e.preventDefault();

            var url = btn.getAttribute('data-share-url') || window.location.href;

            copyToClipboard(url).then(function (ok) {
                showToast(ok ? 'Ссылка скопирована' : 'Не удалось скопировать ссылку');
            });
        });

        // 3. Копирование
        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text)
                    .then(function () { return true; })
                    .catch(function () { return legacyCopy(text); });
            }
            return Promise.resolve(legacyCopy(text));
        }

        function legacyCopy(text) {
            try {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.top = '-1000px';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                ta.setSelectionRange(0, ta.value.length);
                var ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch (err) { return false; }
        }

        // 4. Тост
        var toastTimer = null;

        function showToast(message) {
            var toast = document.getElementById('shareToast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'shareToast';
                toast.className = 'share-toast';
                toast.setAttribute('role', 'status');
                toast.setAttribute('aria-live', 'polite');
                document.body.appendChild(toast);
            }

            toast.textContent = message;
            toast.classList.add('share-toast--visible');

            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function () {
                toast.classList.remove('share-toast--visible');
            }, 2400);
        }
    });
})();
</script>
