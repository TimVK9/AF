<script>
(function () {
    'use strict';

    document.addEventListener('DOMContentLoaded', function () {
        var galleries = document.querySelectorAll('[data-gallery]');
        if (!galleries.length) return;

        var activeGallery = null;
        var activeState = null;

        galleries.forEach(function (gallery) {
            var mains = gallery.querySelectorAll('[data-gallery-main]');
            var thumbs = gallery.querySelectorAll('[data-gallery-thumb]');
            var prevBtn = gallery.querySelector('[data-gallery-prev]');
            var nextBtn = gallery.querySelector('[data-gallery-next]');
            var counter = gallery.querySelector('[data-gallery-current]');

            if (!mains.length) return;

            var current = 0;
            var total = mains.length;

            var state = {
                show: function (index) {
                    if (index < 0) index = total - 1;
                    if (index >= total) index = 0;
                    current = index;

                    mains.forEach(function (img, i) {
                        img.classList.toggle('is-active', i === current);
                    });
                    thumbs.forEach(function (t, i) {
                        t.classList.toggle('is-active', i === current);
                    });
                    if (counter) counter.textContent = String(current + 1);
                },
                next: function () { state.show(current + 1); },
                prev: function () { state.show(current - 1); }
            };

            gallery._galleryState = state;

            if (prevBtn) prevBtn.addEventListener('click', state.prev);
            if (nextBtn) nextBtn.addEventListener('click', state.next);

            thumbs.forEach(function (thumb) {
                thumb.addEventListener('click', function () {
                    var idx = parseInt(thumb.getAttribute('data-index'), 10) || 0;
                    state.show(idx);
                });
            });

            // Свайп
            var touchStartX = 0;
            gallery.addEventListener('touchstart', function (e) {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            gallery.addEventListener('touchend', function (e) {
                var diff = touchStartX - e.changedTouches[0].screenX;
                if (Math.abs(diff) > 40) {
                    if (diff > 0) state.next();
                    else state.prev();
                }
            }, { passive: true });

            // Активация при наведении/тапе
            gallery.addEventListener('mouseenter', function () {
                activeGallery = gallery;
                activeState = state;
            });
            gallery.addEventListener('touchstart', function () {
                activeGallery = gallery;
                activeState = state;
            }, { passive: true });
        });

        // Единый обработчик клавиатуры
        document.addEventListener('keydown', function (e) {
            if (!activeState || !activeGallery || !activeGallery.offsetParent) return;
            if (e.key === 'ArrowLeft') activeState.prev();
            if (e.key === 'ArrowRight') activeState.next();
        });
    });
})();
</script>
