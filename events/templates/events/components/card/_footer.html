{% comment %}
Футер карточки: ссылка «Подробнее».

Счётчик просмотров удалён вместе с моделью EventView —
теперь здесь только призыв к действию.
{% endcomment %}
<div class="event-card__footer">

    <span class="event-card__meta-hint">
        {% if event.is_free %}
            Вход свободный
        {% elif event.price %}
            от {{ event.price }} ₽
        {% else %}
            Цена уточняется
        {% endif %}
    </span>

    <span class="event-card__link">
        Подробнее
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
        </svg>
    </span>

</div>
