<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>АФИША ИСКИТИМ — скоро запуск</title>
    <style>
        :root {
            --accent: #0f766e;
            --accent-hover: #0b5e57;
            --accent-glow: rgba(15, 118, 110, 0.25);
            --accent-light: rgba(15, 118, 110, 0.10);
            --bg-primary: #f7f9f8;
            --bg-secondary: #ffffff;
            --bg-tertiary: #eef2f1;
            --text-primary: #14181a;
            --text-secondary: #3d474b;
            --text-muted: #6b767a;
            --border: rgba(20, 24, 26, 0.08);
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, var(--accent-light) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .soon {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 560px;
            text-align: center;
        }

        .soon__logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 1.35rem;
            letter-spacing: -0.5px;
            margin-bottom: 36px;
        }

        .soon__logo svg {
            color: var(--accent);
            flex-shrink: 0;
        }

        .soon__logo .accent {
            color: var(--accent);
        }

        .soon__card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 48px 36px;
            box-shadow: 0 20px 60px rgba(20, 24, 26, 0.08);
            animation: fadeUp 0.7s cubic-bezier(0.4, 0, 0.2, 1) both;
        }

        .soon__icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--accent-light);
            color: var(--accent);
            animation: pulse 2.8s ease-in-out infinite;
        }

        .soon__icon svg {
            width: 36px;
            height: 36px;
        }

        .soon__title {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .soon__title .accent {
            color: var(--accent);
        }

        .soon__text {
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 420px;
            margin: 0 auto 32px;
        }

        .soon__progress {
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .soon__progress-bar {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--accent), var(--accent-hover));
            border-radius: 999px;
            animation: loadBar 2.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .soon__progress-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .soon__actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: var(--radius);
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: all var(--transition);
            white-space: nowrap;
        }

        .btn--primary {
            background: var(--accent);
            color: #fff;
        }

        .btn--primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        .soon__footer {
            margin-top: 32px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
            50% { box-shadow: 0 0 0 14px rgba(15, 118, 110, 0); }
        }

        @keyframes loadBar {
            from { width: 0; }
            to { width: 78%; }
        }

        @media (max-width: 480px) {
            body { padding: 16px; }

            .soon__card {
                padding: 36px 22px;
                border-radius: var(--radius-lg);
            }

            .soon__title { font-size: 1.5rem; }
            .soon__text { font-size: 0.92rem; }
            .soon__logo { font-size: 1.15rem; }
            .soon__logo svg { width: 26px; height: 26px; }

            .btn { width: 100%; }
            .soon__actions { flex-direction: column; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
            .soon__progress-bar { width: 78%; }
        }
    </style>
</head>
<body>

    <main class="soon">
        <a href="/" class="soon__logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span>АФИША <span class="accent">ИСКИТИМ</span></span>
        </a>

        <div class="soon__card">
            <div class="soon__icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
            </div>

            <h1 class="soon__title">Сайт скоро <span class="accent">начнёт работу</span></h1>
            <p class="soon__text">
                Мы готовим афишу событий вашего города: концерты, спектакли, выставки и фестивали.
                Совсем немного — и всё будет доступно.
            </p>

            <div class="soon__progress">
                <div class="soon__progress-bar"></div>
            </div>
            <p class="soon__progress-label">Готовность — 78%</p>

            <div class="soon__actions">
                <a href="mailto:hello@afisha-iskitim.ru" class="btn btn--primary">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                    hello@afisha-iskitim.ru
                </a>
            </div>
        </div>

        <p class="soon__footer">© 2026 АФИША ИСКИТИМ. Все права защищены.</p>
    </main>

</body>
</html>
