{% load static %}

<footer class="site-footer">
    <div class="footer-container">

        <div class="footer-info">
            <p class="footer-info__brand">
                <span class="logo-text">АФИША<span class="logo-accent">ИСКИТИМ</span></span>
            </p>
            <p>&copy; {% now "Y" %} Афиша мероприятий города Искитима</p>
        </div>

        <div class="footer-links">
            <a href="{% url 'pages:about' %}">О нас</a>
            <a href="{% url 'pages:contacts' %}">Контакты</a>
            <a href="{% url 'pages:help' %}">Помощь</a>
            <a href="{% url 'pages:privacy' %}">Политика конфиденциальности</a>
            <a href="{% url 'pages:cookies' %}">Cookies</a>
            <a href="{% url 'pages:terms' %}">Соглашение</a>
        </div>

        {% if all_categories %}
        <div class="footer-categories">
            {% for cat in all_categories %}
                <a href="{% url 'events:home' %}?category={{ cat.slug }}">{{ cat.name }}</a>
            {% endfor %}
        </div>
        {% endif %}

    </div>
</footer>
